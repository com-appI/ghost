<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NVIDIA Nemotron 3 Ultra (Thinking)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0e1a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
  header { background: #12182a; padding: 12px 16px; border-bottom: 1px solid #1f2a44; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  header h1 { font-size: 16px; color: #76b900; margin-right: auto; }
  header input { padding: 6px 10px; background: #0a0e1a; border: 1px solid #2a3550; border-radius: 6px; color: #e2e8f0; font-size: 12px; font-family: monospace; width: 300px; }
  header button { padding: 6px 12px; background: #76b900; color: #0a0e1a; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; }
  header button:hover { background: #8fd400; }
  #status { width: 100%; font-size: 11px; color: #64748b; padding-top: 4px; }
  #status.ok { color: #10b981; }
  #status.err { color: #ef4444; }

  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: #1e293b; border: 1px solid #2a3550; border-bottom-left-radius: 4px; width: 100%; max-width: 100%; }
  .msg.err { align-self: flex-start; background: #450a0a; border: 1px solid #ef4444; color: #fecaca; }
  .msg.sys { align-self: center; background: transparent; color: #64748b; font-size: 12px; font-style: italic; }
  
  .thinking-box {
    background: #0f172a;
    border-left: 3px solid #64748b;
    padding: 8px 12px;
    margin-bottom: 12px;
    font-size: 13px;
    color: #94a3b8;
    font-style: italic;
    white-space: pre-wrap;
    display: none;
  }
  .thinking-box.active { display: block; }
  .thinking-title { font-weight: bold; color: #64748b; margin-bottom: 4px; font-style: normal; font-size: 11px; text-transform: uppercase; }
  
  .content-box {
    white-space: pre-wrap;
    color: #e2e8f0;
  }

  #inputBar { display: flex; padding: 12px 16px; background: #12182a; border-top: 1px solid #1f2a44; gap: 8px; }
  #inputBar textarea { flex: 1; padding: 10px 14px; background: #0a0e1a; border: 1px solid #2a3550; border-radius: 8px; color: #e2e8f0; font-size: 14px; font-family: inherit; resize: none; max-height: 120px; min-height: 42px; }
  #inputBar textarea:focus { outline: none; border-color: #76b900; }
  #inputBar button { padding: 0 20px; background: #76b900; color: #0a0e1a; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px; }
  #inputBar button:disabled { opacity: 0.4; cursor: not-allowed; }
  #inputBar button:hover:not(:disabled) { background: #8fd400; }
</style>
</head>
<body>

<header>
  <h1>🟢 Nemotron 3 Ultra 550B</h1>
  <input id="keyInput" type="password" value="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" placeholder="nvapi-..." />
  <button onclick="clearChat()">Очистить</button>
  <div id="status">Готов к работе. Модель: nvidia/nemotron-3-ultra-550b-a55b</div>
</header>

<div id="chat">
  <div class="msg sys">Чат инициализирован. Стриминг и режим "Thinking" включены.</div>
</div>

<div id="inputBar">
  <textarea id="userInput" rows="1" placeholder="Напиши сообщение… (Enter — отправить)"></textarea>
  <button id="sendBtn" onclick="sendMessage()">→</button>
</div>

<script>
  const API_URL = "https://integrate.api.nvidia.com/v1/chat/completions";
  const chat = document.getElementById("chat");
  const input = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");
  const statusEl = document.getElementById("status");
  let history = [];

  function setStatus(text, cls = "") {
    statusEl.textContent = text;
    statusEl.className = cls;
  }

  function addMsg(text, role) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function clearChat() {
    chat.innerHTML = '<div class="msg sys">Чат очищен.</div>';
    history = [];
    setStatus("Чат очищен.");
  }

  async function sendMessage() {
    const text = input.value.trim();
    const key = document.getElementById("keyInput").value.trim();
    if (!text) return;
    if (!key) { setStatus("❌ Нет ключа", "err"); return; }

    // Добавляем сообщение пользователя
    addMsg(text, "user");
    input.value = "";
    input.style.height = "auto";
    history.push({ role: "user", content: text });

    sendBtn.disabled = true;
    setStatus("⏳ Генерация ответа...", "");

    // Создаем пузырь для ответа бота
    const botMsg = document.createElement("div");
    botMsg.className = "msg bot";
    
    const thinkingBox = document.createElement("div");
    thinkingBox.className = "thinking-box";
    thinkingBox.innerHTML = '<div class="thinking-title">🧠 Reasoning Process</div><div class="thinking-text"></div>';
    
    const contentBox = document.createElement("div");
    contentBox.className = "content-box";
    
    botMsg.appendChild(thinkingBox);
    botMsg.appendChild(contentBox);
    chat.appendChild(botMsg);
    chat.scrollTop = chat.scrollHeight;

    const thinkingText = thinkingBox.querySelector(".thinking-text");
    let fullContent = "";
    let fullReasoning = "";

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + key,
          'Content-Type': 'application/json',
          'Accept': 'text/event-stream'
        },
        body: JSON.stringify({
          model: "nvidia/nemotron-3-ultra-550b-a55b",
          messages: history,
          temperature: 1,
          top_p: 0.95,
          max_tokens: 16384,
          stream: true,
          chat_template_kwargs: { enable_thinking: true }
        })
      });

      if (!response.ok) {
        const err = await response.text();
        throw new Error(`HTTP ${response.status}: ${err}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        
        // Оставляем последнюю неполную строку в буфере
        buffer = lines.pop(); 

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed.startsWith('data: ')) continue;
          
          const dataStr = trimmed.slice(6);
          if (dataStr === '[DONE]') continue;

          try {
            const data = JSON.parse(dataStr);
            if (data.choices && data.choices.length > 0) {
              const delta = data.choices[0].delta;
              
              // Обработка "размышлений" (reasoning_content)
              if (delta.reasoning_content) {
                fullReasoning += delta.reasoning_content;
                thinkingBox.classList.add('active');
                thinkingText.textContent = fullReasoning;
                // Скроллим вниз, если пользователь не отлистал вверх
                if (chat.scrollHeight - chat.scrollTop - chat.clientHeight < 100) {
                  chat.scrollTop = chat.scrollHeight;
                }
              }

              // Обработка финального ответа (content)
              if (delta.content) {
                fullContent += delta.content;
                contentBox.textContent = fullContent;
                if (chat.scrollHeight - chat.scrollTop - chat.clientHeight < 100) {
                  chat.scrollTop = chat.scrollHeight;
                }
              }
            }
          } catch (e) {
            // Игнорируем неполный JSON на стыке чанков
          }
        }
      }

      // Завершение
      if (!fullContent && !fullReasoning) {
        contentBox.textContent = "⚠️ Модель вернула пустой ответ.";
      }
      
      // Сохраняем в историю только финальный текст
      if (fullContent) {
        history.push({ role: "assistant", content: fullContent });
      }
      setStatus("✅ Готово", "ok");

    } catch (e) {
      botMsg.className = "msg err";
      botMsg.innerHTML = "❌ Ошибка: " + e.message;
      setStatus("❌ Ошибка", "err");
      console.error(e);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  // Отправка по Enter
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });
</script>
</body>
</html>
