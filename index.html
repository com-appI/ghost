<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка моделей NVIDIA NIM</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0e1a; color: #e2e8f0; padding: 20px; box-sizing: border-box; }
        .card { max-width: 800px; margin: 0 auto; background: #12182a; border-radius: 12px; padding: 24px; border: 1px solid #1f2a44; }
        h1 { font-size: 20px; color: #76b900; margin-top: 0; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; margin-top: 18px; }
        input { width: 100%; padding: 12px 14px; background: #0a0e1a; border: 1px solid #2a3550; border-radius: 8px; color: #e2e8f0; font-size: 14px; font-family: monospace; box-sizing: border-box; }
        input:focus { outline: none; border-color: #76b900; }
        button { width: 100%; padding: 14px; margin-top: 20px; background: #76b900; color: #0a0e1a; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
        button:hover { background: #8fd400; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { margin-top: 20px; padding: 14px; border-radius: 8px; font-size: 14px; display: none; }
        #status.ok { background: #064e3b; border: 1px solid #10b981; color: #a7f3d0; display: block; }
        #status.err { background: #450a0a; border: 1px solid #ef4444; color: #fecaca; display: block; }
        #status.loading { background: #1e3a5f; border: 1px solid #3b82f6; color: #bfdbfe; display: block; }
        #modelList { margin-top: 16px; max-height: 400px; overflow-y: auto; background: #0a0e1a; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 13px; line-height: 1.8; display: none; }
        .model-item { padding: 4px 0; border-bottom: 1px solid #1f2a44; }
        .model-item:last-child { border-bottom: none; }
        .model-id { color: #76b900; }
        .model-owner { color: #64748b; font-size: 11px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔍 Список моделей NVIDIA NIM</h1>
        <p style="color: #94a3b8; font-size: 13px; margin-bottom: 0;">Введите ключ и нажмите «Получить список» — ниже появятся все модели, доступные вашему аккаунту.</p>

        <label for="keyInput">API Key</label>
        <input type="password" id="keyInput" value="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" spellcheck="false">

        <button id="loadBtn" onclick="loadModels()">Получить список</button>

        <div id="status"></div>
        <div id="modelList"></div>
    </div>

    <script>
        async function loadModels() {
            const key = document.getElementById('keyInput').value.trim();
            const btn = document.getElementById('loadBtn');
            const status = document.getElementById('status');
            const listEl = document.getElementById('modelList');

            if (!key) {
                status.className = 'err';
                status.textContent = '❌ Введите ключ.';
                status.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Загружаю…';
            status.className = 'loading';
            status.textContent = '⏳ Запрос к NVIDIA API…';
            status.style.display = 'block';
            listEl.style.display = 'none';

            try {
                const r = await fetch('https://integrate.api.nvidia.com/v1/models', {
                    headers: {
                        'Authorization': 'Bearer ' + key,
                        'Accept': 'application/json'
                    }
                });

                const data = await r.json();

                if (r.ok) {
                    const models = data.data || [];
                    status.className = 'ok';
                    status.textContent = `✅ Ключ рабочий. Доступно моделей: ${models.length}`;
                    status.style.display = 'block';

                    if (models.length === 0) {
                        listEl.innerHTML = '<div style="color:#94a3b8; padding:12px;">Список пуст — возможно, у ключа нет доступа ни к одной модели.</div>';
                    } else {
                        listEl.innerHTML = models.map(m => `
                            <div class="model-item">
                                <span class="model-id">${escapeHtml(m.id)}</span>
                                <span class="model-owner">— ${escapeHtml(m.owned_by || '—')}</span>
                            </div>
                        `).join('');
                    }
                    listEl.style.display = 'block';
                } else {
                    status.className = 'err';
                    status.textContent = `❌ Ошибка ${r.status}: ${data.message || data.error?.message || JSON.stringify(data)}`;
                    status.style.display = 'block';
                }
            } catch (e) {
                status.className = 'err';
                status.textContent = '❌ Сеть/CORS: ' + e.message + '\n\nЕсли это CORS — откройте консоль (F12), скопируйте cURL-команду и выполните в терминале.';
                status.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Получить список';
            }
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
    </script>
</body>
</html>
